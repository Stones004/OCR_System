# ======================================================================
# OCR answer-script scanner -- single config file for the whole service.
#
# Layout follows D:\OMR_System's own convention: most sections are read
# as a raw dict (app.core.config.config_loader.CONFIG) by the ported
# job-manager/pipeline/services/api layers. The `ocr_engine:` section is
# the one this project owns end-to-end, and it keeps D:\OCR_codes's
# stricter discipline: app.core.config.ocr_engine_config validates it
# against typed dataclasses with NO defaults in code -- a missing key is
# a startup error naming the key.
#
# All paths below are relative to this file's folder (BASE_DIR), resolved
# by config_loader.py. Colours in ocr_engine.visualization are BGR
# (OpenCV order); colours in the top-level visualization.class_colors are
# also BGR.
# ======================================================================


# ----------------------------------------------------------------------
# Paths
# ----------------------------------------------------------------------

paths:
  incoming_dir: scans/incoming
  accepted_dir: scans/accepted
  processed_dir: scans/processed
  review_dir: scans/review
  needs_rescan_dir: scans/needs_rescan
  exports_dir: scans/exports
  reports_dir: reports
  manifest_dir: scans/manifests
  ui_output_dir: output/annotated/ui
  debug_output_dir: output/annotated/debug
  logs_dir: logs
  temp_pages_dir: runtime/temp_pages
  page_cache_dir: runtime/page_cache

pdf:
  dpi: 300
  # Every booklet opens with a 2-page cover (marks-grid facing sheet +
  # blank flip side) with no margin/answer-column split, so this many
  # leading pages are dropped before page numbering starts at 1.
  skip_pages: 2
  supported_extensions: [".pdf"]


# ----------------------------------------------------------------------
# Runtime / execution
# ----------------------------------------------------------------------

runtime:
  preferred_device: cpu
  fallback_device: cpu
  api_mode: false
  manifest_cache: true
  watch_mode: true
  # Substring app/api/routes/health.py looks for among live Celery worker
  # names to report the OCR worker (the single-consumer PARSeq queue) as
  # healthy. Matches the worker name in docker-compose.yml / start scripts.
  gpu_worker_name: ocr-worker

execution:
  backend: celery
  broker_url: redis://localhost:6379/0

output:
  save_exports: true
  save_visualizations: true
  json_indent: 4

api:
  host: 0.0.0.0
  port: 8000

system:
  version: 1.0.0
  environment: development

watcher:
  polling_interval: 1
  recursive: false

debug:
  show_debug_windows: false
  verbose_logging: true

reports:
  save_json_reports: true
  include_page_metrics: true


# ----------------------------------------------------------------------
# Logging
# ----------------------------------------------------------------------

logging:
  level: INFO
  save_logs: true
  console_logging: true


# ----------------------------------------------------------------------
# Observability (OpenTelemetry -> OpenObserve) and monitoring
# ----------------------------------------------------------------------

observability:
  enabled: false
  service_name: ocr-answer-scanner
  # "openobserve" (the Docker Compose service name) doesn't resolve from
  # the host -- native mode's OpenObserve container is reached at
  # localhost (see RUNBOOK.md's `docker run -p 5080:5080 ...`).
  # config.docker.yaml keeps the "openobserve" hostname, resolvable
  # inside the Compose network.
  endpoint: http://localhost:5080/api/default/v1/traces
  environment: development
  organization: default
  username: admin@example.com
  # Must match the OpenObserve container's ZO_ROOT_USER_PASSWORD (see
  # RUNBOOK.md's `docker run` command) -- OpenObserve authenticates
  # trace ingestion with this root user's own credentials, there's no
  # separate API key. Also must satisfy OpenObserve's password policy:
  # 8-128 chars, at least one lowercase, one uppercase, one digit, one
  # special character.
  password: Admin@123


# ----------------------------------------------------------------------
# Validation thresholds -- provisioned for app/validator (see its
# README note: checks are currently pass-through stubs; these values
# are wired up but not yet enforced).
# ----------------------------------------------------------------------

thresholds:
  geometry:
    min_page_coverage: 0.6
    min_perspective_score: 0.8
    border_margin: 15
  blur:
    hard_threshold: 35
    soft_threshold: 55
  skew:
    max_safe_angle: 10
    min_hough_lines: 5
  brightness:
    min_brightness: 120
    max_brightness: 245
  contrast:
    min_contrast: 14
  content_density:
    min_density: 0.02
  edge_density:
    min_density: 0.012
  scoring:
    min_acceptable_score: 60

layout:
  aspect_ratio:
    min: 1.2
    max: 1.6
  qr_required: false


# ----------------------------------------------------------------------
# Visualization (service-level: app/services/visualization_service.py)
# ----------------------------------------------------------------------

visualization:
  enabled: true
  save_ui_images: false
  save_debug_images: true
  detection_box_thickness: 2
  font_scale: 0.65
  image_format: "jpg"
  jpeg_quality: 95
  class_colors:
    question_label: [0, 0, 255]
    answer_region: [0, 200, 0]


# ----------------------------------------------------------------------
# OCR ENGINE -- everything app/engine/* owns. Strict schema, no defaults.
# Values here are carried over unchanged from D:\OCR_codes\config.yaml.
# ----------------------------------------------------------------------

ocr_engine:

  pipeline:
    use_annotation_removal: true      # erase red/green reviewer ink before detection
    use_noise_classifier: false       # drop "noise" ROIs before PARSeq ever sees them (see noise_classifier below)
    verbose: false                    # per-component / per-candidate console logging

  deskew:
    angle_min: -5.0
    angle_max: 5.0
    coarse_step: 0.5
    fine_step: 0.05
    fine_window: 0.5
    border_value: 255
    edge_fallback_angle: 0.0
    search_width: 800                 # downscale width for the angle search (see deskewer.py)

  vertical:
    threshold: 180
    min_kernel_height: 80
    kernel_height_divisor: 25
    repair_kernel: [3, 15]

  separator:
    left_ratio: 0.03
    right_ratio: 0.30
    min_height_ratio: 0.50
    min_aspect_ratio: 40
    expected_x: null
    tolerance: null

  crop:
    right_padding: 5

  ink_removal:
    red_lower1: [0, 100, 60]
    red_upper1: [15, 255, 255]
    red_lower2: [168, 100, 60]
    red_upper2: [179, 255, 255]
    green_lower: [40, 100, 60]
    green_upper: [100, 255, 255]
    kernel_size: 5
    close_iterations: 2
    dilate_iterations: 2
    remove_fringe: true
    fringe_zone_kernel_size: 11
    fringe_zone_iterations: 4
    fringe_lightness_max: 250
    fringe_min_component_area: 500
    fill_color: [255, 255, 255]

  preprocess:
    min_area: 20
    min_contrast_gap: 30

  annotation_detector:
    min_width: 4
    min_height: 3
    padding: 10
    merge_dist: 16
    min_confident_area: 70
    min_confident_dim: 4
    min_ink_pixels: 15
    min_fill_ratio: 0.03
    row_y_tolerance: 18

    reject_above_top_line: true
    top_line_search_frac: 0.2
    top_line_min_len_ratio: 0.6
    top_line_margin: 5

    exclude_sparse_strokes: true
    sparse_stroke_density_max: 0.12
    sparse_stroke_min_dim: 80

    exclude_long_vertical_strips: true
    long_strip_max_width: 30
    long_strip_min_height: 100

    refine_height: 140
    valley_threshold: 0.15
    min_valley_width: 5
    min_segment_height: 20
    refine_blur_ksize: 9

    line_kernel_min: 30
    line_kernel_divisor: 4
    line_dilate_kernel: 3

  visualization:
    separator_candidate_color: [0, 255, 0]
    separator_candidate_thickness: 2
    separator_selected_color: [0, 0, 255]
    separator_selected_thickness: 4
    roi_color: [0, 0, 255]
    roi_thickness: 2

  noise_classifier:
    # Set pipeline.use_noise_classifier above to true to turn this on.
    # Reuses the PARSeq venv for torch/torchvision (this project's own
    # venv has neither).
    venv_python: D:/OCR_System/venv_parseq/Scripts/python.exe
    checkpoint: D:/OCR_System/weights/noise_classifier/best.pt
    device: auto
    confidence_threshold: 0.7
    drop_uncertain: false
    shutdown_timeout: 10

  ocr:
    backend: parseq

    parseq:
      # PARSeq needs torch/strhub -- venv_parseq/ is a self-contained copy
      # of D:\OCR_codes's venv (incl. its editable strhub checkout), kept
      # inside this repo so production doesn't depend on another project's
      # directory. See README for rebuilding it from scratch if needed.
      venv_python: D:/OCR_System/venv_parseq/Scripts/python.exe
      checkpoint: D:/OCR_System/weights/parseq_base_mix_v2.ckpt
      device: auto
      norm_mean: 0.5
      norm_std: 0.5
      shutdown_timeout: 10

  assembler:
    export_version: 1

  question_mapping:
    override_file: data/overrides/question_paper_overrides.yaml
    # Set false once every question paper in use follows the strict NNa
    # ("07b") scheme -- turns bare numerals ("7", "10") back into a
    # review flag instead of auto-resolving them.
    allow_bare_numerals: true
